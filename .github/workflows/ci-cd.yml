name: CI/CD Pipeline F.C.S.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  build_and_test:
    name: 1. Construccion, Pruebas Unitarias y Calidad PSR-12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP 8.2 y herramientas QA
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, gd, zip
          ini-values: memory_limit=256M
          tools: composer, phpunit, phpcodesniffer

      - name: Instalar dependencias Composer (si existe composer.json)
        if: hashFiles('composer.json') != ''
        run: composer install --no-interaction --prefer-dist

      - name: Ejecutar pruebas unitarias (PHPUnit)
        run: phpunit --configuration phpunit.xml

      - name: Validar estandar de codigo PSR-12 (PHP_CodeSniffer)
        run: phpcs --standard=phpcs.xml

  staging_release_and_smoke:
    name: 2. Entorno de Liberacion (Staging) y Smoke Tests
    runs-on: ubuntu-latest
    needs: build_and_test
    environment:
      name: staging
      url: http://localhost:8080/health.php
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Dar permisos de ejecucion a scripts
        run: chmod +x scripts/*.sh

      - name: Desplegar entorno de liberacion y ejecutar Smoke Tests
        env:
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        run: ./scripts/deploy.sh "fcs-app:${{ github.sha }}" "docker-compose.staging.yml"

  deploy_production:
    name: 3. Publicacion de Artefacto y Despliegue Continuo
    runs-on: ubuntu-latest
    needs: staging_release_and_smoke
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://github.com/lugalnt/Proyecto_QR/pkgs/container/proyecto_qr
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesion en GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen Docker versionada
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lugalnt/proyecto_qr:latest
            ghcr.io/lugalnt/proyecto_qr:${{ github.sha }}
